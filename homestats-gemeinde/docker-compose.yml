version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: homestats-gemeinde_web_1
      APP_PORT: 8080

  web:
    # Wird von .github/workflows/release-gemeinde.yml beim Release auf Tag + Digest gesetzt.
    image: ghcr.io/schriftlich/homestats-gemeinde:0.2.0@sha256:86c111e1f773ea4e42e55e1d0f074524a8eab0520e72d9bf197d4d0215242348
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
