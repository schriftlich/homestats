version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: homestats-gemeinde_web_1
      APP_PORT: 8080

  web:
    # Wird von .github/workflows/release-gemeinde.yml beim Release auf Tag + Digest gesetzt.
    image: ghcr.io/schriftlich/homestats-gemeinde:0.3.0@sha256:3249b6cb35179dc8178d141cef8cf8f2d446554634ca6648bc34b4bd65701de3
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
