version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: homestats-gemeinde_web_1
      APP_PORT: 8080

  web:
    # Wird von .github/workflows/release-gemeinde.yml beim Release auf Tag + Digest gesetzt.
    image: ghcr.io/schriftlich/homestats-gemeinde:0.1.0@sha256:b8291a6ed70d6355f95721dbc688ffc0b619ba845ec94d774a0c901884838a42
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
