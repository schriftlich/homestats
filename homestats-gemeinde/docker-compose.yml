version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: homestats-gemeinde_web_1
      APP_PORT: 8080

  web:
    # Wird von .github/workflows/release-gemeinde.yml beim Release auf Tag + Digest gesetzt.
    image: ghcr.io/schriftlich/homestats-gemeinde:0.4.0@sha256:b2e0a6ee8fbac65ba67b27084a9faf40704af6655b4595f39f5e31aecfed3ccd
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data/db:/data
