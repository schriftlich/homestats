<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a19">
  <title>{% block title %}Zählerstände{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='icon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}" defer></script>
</head>
<body>
{% set path = request.url.path %}
<header class="top">
  <a class="brand" href="/">Zählerstände</a>
  <a class="iconbtn" href="/daten" title="Export / Import">Daten</a>
  <button class="iconbtn" id="theme" type="button" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel umschalten"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
</header>
<main>
{% block content %}{% endblock %}
<p class="muted small" style="text-align:center;margin-top:24px">Version {{ version }}</p>
</main>
<nav class="nav">
  <a href="/" class="{{ 'on' if path == '/' }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Übersicht</a>
  <a href="/ablesungen" class="{{ 'on' if path.startswith('/ablesungen') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Verlauf</a>
  <a href="/ablesung" class="add {{ 'on' if path == '/ablesung' }}">
    <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Ablesen</a>
  <a href="/zaehler" class="{{ 'on' if path.startswith('/zaehler') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13l4-4M12 2v3"/></svg>Zähler</a>
  <a href="/tarife" class="{{ 'on' if path.startswith('/tarife') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 7a6 6 0 1 0 0 10M4 10h9M4 14h9"/></svg>Tarife</a>
</nav>
<script>
  document.getElementById("theme").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    document.dispatchEvent(new Event("themechange"));
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
