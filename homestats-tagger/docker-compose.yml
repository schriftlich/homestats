version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: homestats-tagger_web_1
      APP_PORT: 8080

  web:
    # Wird von .github/workflows/release-tagger.yml beim Release auf Tag + Digest gesetzt.
    image: ghcr.io/schriftlich/homestats-tagger:0.1.0@sha256:f0d0cecf2607297f9f415502304bec477993ff420f9a75f81ab6e6899b79d94b
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Gemeinsamer Download-Ordner: metube (Eingang), music (Navidrome), audiobooks (Audiobookshelf)
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
