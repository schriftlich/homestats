version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: homestats-tagger_web_1
      APP_PORT: 8080

  web:
    # Wird von .github/workflows/release-tagger.yml beim Release auf Tag + Digest gesetzt.
    image: ghcr.io/schriftlich/homestats-tagger:0.0.0
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Gemeinsamer Download-Ordner: metube (Eingang), music (Navidrome), audiobooks (Audiobookshelf)
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
