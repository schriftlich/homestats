version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: homestats-tagger_web_1
      APP_PORT: 8080

  web:
    # Wird von .github/workflows/release-tagger.yml beim Release auf Tag + Digest gesetzt.
    image: ghcr.io/schriftlich/homestats-tagger:0.1.1@sha256:8dc04bdbe0a858d56e43653fd430e02b81d4bc321ebd277d3074a4d9ae42314a
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Gemeinsamer Download-Ordner: metube (Eingang), music (Navidrome), audiobooks (Audiobookshelf)
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
