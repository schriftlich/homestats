version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: homestats-bankimport_web_1
      APP_PORT: 8080

  web:
    # Wird von .github/workflows/release-bankimport.yml beim Release auf Tag + Digest gesetzt.
    image: ghcr.io/schriftlich/homestats-bankimport:0.1.0@sha256:e73be36c65ac5bb57f3541516aec1f654e4ecbb86b1c54b2373ad2db94eb8524
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data/settings:/data
