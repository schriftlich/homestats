version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: homestats-bankimport_web_1
      APP_PORT: 8080

  web:
    # Wird von .github/workflows/release-bankimport.yml beim Release auf Tag + Digest gesetzt.
    image: ghcr.io/schriftlich/homestats-bankimport:0.4.0@sha256:cb872a21171af88e6b8b2c96899c532864b3eb4a8f46f96a12e5a201792ebc76
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data/settings:/data
