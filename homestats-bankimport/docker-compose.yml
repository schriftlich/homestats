version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: homestats-bankimport_web_1
      APP_PORT: 8080

  web:
    # Wird von .github/workflows/release-bankimport.yml beim Release auf Tag + Digest gesetzt.
    image: ghcr.io/schriftlich/homestats-bankimport:0.3.0@sha256:040d985d4cc253a004a05a7b4dde67a16b1b2c5de0ea35a9d3a92bcd6dacf334
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data/settings:/data
