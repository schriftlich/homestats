version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: homestats-bankimport_web_1
      APP_PORT: 8080

  web:
    # Wird von .github/workflows/release-bankimport.yml beim Release auf Tag + Digest gesetzt.
    image: ghcr.io/schriftlich/homestats-bankimport:0.2.0@sha256:1af4e95b95bb84a26b4b4a28062895bb260424c9f47519dcef212439a152e185
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - ${APP_DATA_DIR}/data/settings:/data
