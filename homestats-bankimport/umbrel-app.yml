manifestVersion: 1
id: homestats-bankimport
category: finance
name: Bank-Import
version: "0.1.0"
tagline: Kontoauszüge per Upload direkt in Firefly III übernehmen
icon: https://raw.githubusercontent.com/schriftlich/homestats/main/homestats-bankimport/icon.svg
description: >-
  CSV-Export der Bank hochladen, Vorschau prüfen, mit einem Klick nach
  Firefly III übernehmen. Die App ist durch die Umbrel-Anmeldung geschützt.


  - Erkennt das eigene Konto automatisch an der IBAN

  - Umbuchungen zwischen eigenen Konten werden als solche angelegt

  - Bereits vorhandene und vorgemerkte Buchungen werden übersprungen

  - Überlange Verwendungszwecke werden gekürzt, der volle Text landet in der Notiz

  - Firefly-Regeln werden beim Import angewendet

  - Unterstützt bisher: DKB
releaseNotes: >-
  - Kontoauszug (DKB-CSV) hochladen und Vorschau prüfen


     - Buchungen direkt nach Firefly III übernehmen


     - Erkennt Umbuchungen und bereits importierte Buchungen

